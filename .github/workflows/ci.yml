name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incident_user
          POSTGRES_PASSWORD: incident_pass
          POSTGRES_DB: incident_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident_user -d incident_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://incident_user:incident_pass@localhost:5432/incident_db
          PYTHONPATH: .
        run: pytest